<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Моя Крипто Тапалка</title>
    <!-- Telegram Web App SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: linear-gradient(to bottom right, #1e3a8a, #3b82f6);
            color: #fff;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            -webkit-tap-highlight-color: transparent;
        }
        .header { padding: 20px; display: flex; justify-content: space-between; align-items: center; }
        .user-info { display: flex; align-items: center; gap: 10px; background: rgba(255,255,255,0.1); padding: 5px 15px; border-radius: 20px; backdrop-filter: blur(5px); }
        .score-container { text-align: center; margin-top: 20px; }
        .game-title { font-size: 14px; opacity: 0.7; text-transform: uppercase; letter-spacing: 2px; margin-bottom: 5px; }
        .score-display { font-size: 60px; font-weight: 800; text-shadow: 0 4px 10px rgba(0,0,0,0.3); display: flex; justify-content: center; align-items: baseline; gap: 8px;}
        .coin-name { font-size: 20px; opacity: 0.8; font-weight: 600;}
        
        .click-area { flex: 1; display: flex; justify-content: center; align-items: center; position: relative; }
        .main-emoji { 
            font-size: 120px; 
            cursor: pointer; 
            transition: transform 0.1s; 
            filter: drop-shadow(0 15px 20px rgba(0,0,0,0.4));
            z-index: 10;
        }
        .main-emoji:active { transform: scale(0.9); }
        
        .circle-bg { position: absolute; width: 250px; height: 250px; background: rgba(255,255,255,0.05); border-radius: 50%; }
        .circle-bg-2 { position: absolute; width: 300px; height: 300px; background: rgba(255,255,255,0.02); border-radius: 50%; }
        
        .footer { padding: 20px; padding-bottom: max(20px, env(safe-area-inset-bottom)); }
        .action-btn { 
            width: 100%; 
            background: rgba(255,255,255,0.2); 
            color: white; 
            border: 1px solid rgba(255,255,255,0.3);
            padding: 16px; 
            border-radius: 16px; 
            font-size: 16px; 
            font-weight: bold; 
            backdrop-filter: blur(10px);
            cursor: pointer;
        }
        .action-btn:active { background: rgba(255,255,255,0.3); }
        
        .floating-text {
            position: absolute;
            color: white;
            font-weight: bold;
            font-size: 32px;
            pointer-events: none;
            text-shadow: 0 2px 5px rgba(0,0,0,0.5);
            animation: floatUp 1s ease-out forwards;
            z-index: 20;
        }
        
        @keyframes floatUp {
            0% { opacity: 1; transform: translateY(0); }
            100% { opacity: 0; transform: translateY(-150px); }
        }
    </style>
</head>
<body>
    <div class="header">
        <div class="user-info">
            <span id="tg-username">Игрок</span>
        </div>
        <div class="user-info">Топ 🏆</div>
    </div>

    <div class="score-container">
        <div class="game-title">Моя Крипто Тапалка</div>
        <div class="score-display">
            <span id="score">0</span>
            <span class="coin-name">COINS</span>
        </div>
    </div>

    <div class="click-area" id="click-zone">
        <div class="circle-bg-2"></div>
        <div class="circle-bg"></div>
        <div class="main-emoji" id="btn-click">🍕</div>
    </div>

    <div class="footer">
        <button class="action-btn" onclick="showAdPlaceholder()">Смотреть рекламу (x2 клик)</button>
    </div>

    <script>
        // Инициализация Telegram Web App
        const tg = window.Telegram.WebApp;
        tg.expand(); // Развернуть на весь экран
        
        // Получаем имя пользователя из Telegram
        if (tg.initDataUnsafe && tg.initDataUnsafe.user) {
            document.getElementById('tg-username').innerText = tg.initDataUnsafe.user.first_name;
        }

        // Логика игры (с сохранением в локальное хранилище)
        let score = localStorage.getItem('tg_game_score') ? parseInt(localStorage.getItem('tg_game_score')) : 0;
        const scoreEl = document.getElementById('score');
        scoreEl.innerText = score.toLocaleString();

        document.getElementById('btn-click').addEventListener('touchstart', function(e) {
            e.preventDefault(); // Предотвращаем двойной клик на мобилках
            for(let i=0; i<e.changedTouches.length; i++) {
                handleClick(e.changedTouches[i].pageX, e.changedTouches[i].pageY);
            }
        });
        
        document.getElementById('btn-click').addEventListener('mousedown', function(e) {
            handleClick(e.pageX, e.pageY);
        });

        function handleClick(x, y) {
            score++;
            scoreEl.innerText = score.toLocaleString();
            localStorage.setItem('tg_game_score', score);
            
            // Вибрация (Haptic Feedback) в Telegram
            tg.HapticFeedback.impactOccurred('light');

            // Визуальный эффект
            const floatEl = document.createElement('div');
            floatEl.className = 'floating-text';
            floatEl.innerText = '+1';
            floatEl.style.left = (x - 20) + 'px';
            floatEl.style.top = (y - 20) + 'px';
            document.body.appendChild(floatEl);
            
            setTimeout(() => { floatEl.remove(); }, 1000);
        }

        // Место для интеграции рекламы (например Adsgram)
        function showAdPlaceholder() {
            tg.showAlert('Здесь будет показана реклама (интеграция Adsgram). После просмотра игрок получит бонус!');
        }
    </script>
</body>
</html>
